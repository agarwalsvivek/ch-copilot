<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucks to Bar - Income & Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>💰 Bucks to Bar</h1>
            <p>Track your monthly income and expenses at a glance</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" data-tab="data">📊 Data</button>
            <button class="tab-button" data-tab="chart">📈 Chart</button>
        </div>

        <div id="data" class="tab-content active">
            <h2>Monthly Income & Expenses</h2>
            <div class="month-group" id="monthInputs"></div>
        </div>

        <div id="chart" class="tab-content">
            <h2>Income vs Expenses</h2>
            <div class="chart-wrapper">
                <div id="chartContainer">
                    <canvas id="incomeExpenseChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
